<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ASHVALE design studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/studio/studio.css">
</head>
<body>
  <header>
    <h1>ASHVALE <span>Studio</span></h1>
    <div class="menuline">File is a local draft. Suggest sends a review, it does not inscribe.</div>
    <div class="who">
      <label style="margin:0;text-transform:none;letter-spacing:0">you</label>
      <input id="author" type="text" placeholder="your name or @handle" style="width:180px">
    </div>
  </header>
  <div id="tools">
    <button type="button" data-tool="move" class="on" title="Move (G)">V</button>
    <button type="button" data-tool="rotate" title="Rotate (R)">R</button>
    <button type="button" data-tool="scale" title="Scale (S)">S</button>
    <button type="button" data-tool="slice" title="Slice (T)">T</button>
  </div>
  <nav id="nav"></nav>
  <div id="stage">
    <div id="hint">Click a piece. V moves, R rotates, S scales, T slices. Right-drag turns the view.</div>
  </div>
  <aside id="form"></aside>
  <footer id="foot">Local drafts stay on this machine. Suggest to GitHub opens a review PR against main — nothing is inscribed until someone merges it.</footer>
  <input id="import" type="file" accept=".json,image/png,image/jpeg">
  <script type="module" src="/studio/studio.js"></script>
</body>
</html>
