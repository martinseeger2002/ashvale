<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASHVALE World Editor</title>
<style>
:root{--bg:#14171c;--panel:#1d2128;--panel2:#252a33;--line:#343b47;--ink:#e6e2d6;--dim:#9aa1ad;--acc:#e0a33a;--acc2:#6fb1e8;--bad:#e26a5a;--good:#7cc46a}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}
#top{position:fixed;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
#top h1{font-size:14px;margin:0 6px 0 0;letter-spacing:.08em;color:var(--acc);white-space:nowrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#4b5463}.btn.on{background:#3a3220;border-color:var(--acc);color:#ffd88a}.btn.pri{background:#2d4a2a;border-color:#4f7d48}.btn.warn{background:#4a2b26;border-color:#7d4a40}
.btn:disabled{opacity:.45;cursor:default}
select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
#status{margin-left:auto;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
#tools{position:fixed;left:0;top:46px;bottom:0;width:58px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:6px;z-index:4}
#tools .btn{padding:8px 0;text-align:center;font-size:12px}
#tools .btn b{display:block;font-size:17px;line-height:1.1}
#side{position:fixed;right:0;top:46px;bottom:232px;width:270px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px;z-index:4}
#side h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
#side h2:first-child{margin-top:0}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.sw{border:1px solid var(--line);border-radius:5px;padding:4px 2px;text-align:center;cursor:pointer;font-size:10.5px;background:var(--panel2)}
.sw i{display:block;height:16px;border-radius:3px;margin-bottom:3px}
.sw.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.row{display:flex;align-items:center;gap:6px;margin:5px 0}.row label{min-width:62px;color:var(--dim)}
.row input[type=text],.row input[type=number],.row select{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.row input[type=range]{flex:1}
.hint{color:var(--dim);font-size:12px;margin:6px 0}
.chk{display:flex;flex-wrap:wrap;gap:6px}.chk label{display:flex;align-items:center;gap:3px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
#pv{position:fixed;right:0;bottom:0;width:270px;height:232px;background:radial-gradient(ellipse at 50% 70%,#2b3340,#14171c 75%);border-left:1px solid var(--line);border-top:1px solid var(--line);z-index:4}
#pv canvas{width:100%;height:100%}
#pvLabel{position:absolute;left:10px;bottom:8px;right:10px;color:var(--dim);font-size:12px;pointer-events:none}
#stage{position:fixed;left:58px;right:270px;top:46px;bottom:0;background:#0d1013;touch-action:none}
canvas{display:block;width:100%;height:100%}
#coords{position:fixed;left:66px;bottom:8px;background:rgba(20,23,28,.85);padding:3px 8px;border-radius:5px;color:var(--dim);font-variant-numeric:tabular-nums;z-index:3;pointer-events:none}
.overlay{position:fixed;inset:46px 0 0 0;background:#000;z-index:8;display:none}
.overlay.show{display:block}.overlay iframe{border:0;width:100%;height:100%}
.ovbar{position:absolute;left:50%;transform:translateX(-50%);top:10px;display:flex;gap:8px;z-index:2;background:rgba(20,23,28,.88);padding:6px;border-radius:8px;border:1px solid var(--line)}
#log{white-space:pre-wrap;font:11px ui-monospace,monospace;color:var(--dim);max-height:160px;overflow:auto}
@media (max-width:820px){#side,#pv{width:210px}#stage{right:210px}#status{display:none}}
</style></head><body>
<div id="top">
  <h1>ASHVALE · WORLD EDITOR</h1>
  <select id="zone" title="Area"></select>
  <button class="btn" id="atlasBtn" title="Fly the planet, zoom onto a town and edit it">🌍 Atlas</button>
  <button class="btn" id="undo" title="Undo (Ctrl+Z)">↶</button><button class="btn" id="redo" title="Redo (Ctrl+Y)">↷</button>
  <button class="btn" id="prev3d" title="Build a preview with your edits and walk it in 3D">▶ Walk it in 3D</button>
  <button class="btn pri" id="apply" title="Copy this area into the game; the next release carries it">Apply to game</button>
  <button class="btn warn" id="revert" title="Throw away your edits of this area">Revert</button>
  <span id="status">loading…</span>
</div>
<div id="tools"></div>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="coords"></div>
<div id="side"></div>
<div id="pv" title="The selected thing, as it looks in the game"><canvas id="pvc"></canvas><div id="pvLabel"></div></div>
<div class="overlay" id="atlasOv"><div class="ovbar"><button class="btn pri" id="editHere" title="Open the town or area under the middle of the view">✎ Edit here</button><button class="btn" id="newHere" title="Make a new editable area from the land under the middle of the view">＋ New area here</button><select id="newSize" title="Size of a new area"><option value="48">48 m</option><option value="64" selected>64 m</option><option value="96">96 m</option><option value="128">128 m</option></select><button class="btn" id="atlasClose">Close</button></div><div id="sculptBar" class="ovbar" style="top:auto;bottom:12px;flex-wrap:wrap;max-width:96vw;justify-content:center">
  <span style="align-self:center;color:var(--dim)">Terrain</span>
  <button class="btn on" data-sc="look" title="No tool: drag to move, wheel to zoom">✋ Move</button><button class="btn" data-sc="raise" title="Click to raise one step (hold to keep raising)">⬆ Raise</button><button class="btn" data-sc="lower" title="Click to lower one step (hold to keep lowering)">⬇ Lower</button><button class="btn" data-sc="flatten" title="Drag to level the ground to where you first pressed">▭ Level</button><button class="btn" data-sc="water" title="Click for a pond or lake">💧 Water</button><button class="btn" data-sc="stream" title="Drag a stream along the ground">〰 Stream</button><button class="btn" data-sc="trees" title="Drag to plant trees (Shift: clear them)">🌲 Trees</button><button class="btn" data-sc="region" title="Drag to paint a region type">🗺 Region</button>
  <select id="scClim" title="Region type"><option value="0">Temperate forest</option><option value="1">Grassland</option><option value="2">Steppe</option><option value="3" selected>Desert</option><option value="4">Savanna</option><option value="5">Rainforest</option><option value="6">Taiga</option><option value="7">Tundra</option></select>
  <label style="display:flex;align-items:center;gap:4px;color:var(--dim)" title="How wide the brush is, edge to edge">Size <input type="range" id="scR" min="4" max="300" step="2" value="16"><span id="scRv">16 m</span></label>
  <label style="display:flex;align-items:center;gap:4px;color:var(--dim)">Step <input type="range" id="scS" min="0.25" max="4" step="0.25" value="0.5"><span id="scSv">0.5 m</span></label>
  <button class="btn" id="scUndo" title="Undo the last click or drag (Ctrl+Z)">↶ Undo</button><span id="scN" style="align-self:center;color:var(--dim)"></span>
  <button class="btn pri" id="scApply" title="Write the terrain edits into the game's world (the next release carries them)">Apply terrain to game</button><button class="btn warn" id="scRevert">Revert terrain</button>
  <span style="flex-basis:100%;text-align:center;color:var(--dim);font-size:11.5px">Left click: use the tool · Wheel: zoom · Middle-drag: move · Right-drag: turn · Right-click: options</span>
</div>
<div id="brushRing" style="position:absolute;pointer-events:none;border:2px solid rgba(255,216,138,.95);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6);display:none;z-index:3"></div>
<div id="ctxMenu" style="position:absolute;display:none;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:200px;box-shadow:0 6px 24px rgba(0,0,0,.5)"></div>
<div id="aim" style="position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid #ffd88a;border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px #000"></div><iframe id="atlasFr"></iframe></div>
<div class="overlay" id="gameOv"><div class="ovbar"><span id="gameNote" style="align-self:center;color:var(--dim)"></span><button class="btn" id="gameClose">Back to the editor</button></div><iframe id="gameFr"></iframe></div>
<script>
'use strict';
const KEY = new URLSearchParams(location.search).get('k') || '';
const api = async (path, opt) => { const r = await fetch('/api/' + path + (path.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(KEY), Object.assign({ headers: { 'Content-Type': 'application/json' } }, opt || {})); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; };
const $ = (id) => document.getElementById(id);
const status = (t, bad) => { const s = $('status'); s.textContent = t; s.style.color = bad ? 'var(--bad)' : ''; };

/* ---------- what can be painted (the game's own tile letters, data/rules.json + the Atlas palette) ---------- */
const GROUND = [['.', 'Grass'], [',', 'Long grass'], ['f', 'Flowers'], ['p', 'Path'], ['d', 'Dirt'], ['s', 'Sand'], ['~', 'Water'], ['F', 'Fence'], ['r', 'Rocks'], ['K', 'Standing stone']];   /* piers and bridges are assets (the Pier tool), not ground */
const TREES = [['T', 'Tree'], ['P', 'Pine'], ['O', 'Oak'], ['W', 'Willow'], ['M', 'Maple'], ['Y', 'Yew']];
const ORE = [['R', 'Copper'], ['N', 'Tin'], ['I', 'Iron'], ['C', 'Coal'], ['G', 'Gold'], ['A', 'Mithril']];
const BUILD_KINDS = ['house', 'shop', 'smithy', 'inn', 'tavern', 'hall'];
const TOOLS = [['select', '⬚', 'Move'], ['paint', '🖌', 'Paint'], ['forest', '🌲', 'Forest'], ['trail', '〰', 'Trail'], ['building', '🏠', 'Building'], ['pier', '⚓', 'Pier'], ['npc', '🙂', 'NPC'], ['spawn', '🐺', 'Animal'], ['erase', '⌫', 'Erase'], ['pan', '✋', 'Pan']];

let META = null, ZONES = [], zid = '', MOD = null, Z = null, T = null;   /* T: tiles as arrays of chars */
let tool = 'select', paintL = 'p', brush = 2, forestSp = { T: 1, P: 1, O: 1 }, forestD = 0.45, forestRemove = false, trailW = 2, trailL = 'p', bridges = true, spawnM = 'chicken';
let sel = null, drag = null, trail = [], hover = null;
let HG = null, showGround = true;   /* the ground under the area (from the Atlas terrain, edits included): corner heights */
async function loadHeights() { HG = null; const id = zid; try { const r = await api('heights/' + id); if (id === zid && r.h) { HG = r; draw(); side(); } } catch (e) { status('could not read the ground: ' + e.message, true); } }
const cornerH = (x, y) => { if (!HG) return 0; const X = x - HG.origin[0], Y = y - HG.origin[1], W1 = HG.size[0] + 1; if (X < 0 || Y < 0 || X > HG.size[0] || Y > HG.size[1]) return 0; return HG.h[Y * W1 + X]; };
const tileH = (x, y) => (cornerH(x, y) + cornerH(x + 1, y) + cornerH(x, y + 1) + cornerH(x + 1, y + 1)) / 4;
const view = { x: 0, y: 0, s: 8 };
const undoS = [], redoS = [];

/* ---------- load ---------- */
async function boot() {
  if (!KEY) { status('open the link with ?k=… (printed by editor/server.py)', true); return; }
  META = await api('meta'); ZONES = await api('zones');
  $('zone').innerHTML = ZONES.map(z => `<option value="${z.id}">${z.name}${z.edited ? ' •' : ''}</option>`).join('');
  buildTools();
  const want = new URLSearchParams(location.search).get('zone') || (ZONES.find(z => z.id === 'saltmere') ? 'saltmere' : ZONES[0].id);
  await openZone(want);
  preview(false);   /* the Atlas and the 3D walk read the preview build: start one in the background */
}
async function openZone(id, at) {
  zid = id; $('zone').value = id;
  MOD = await api('zone/' + id); Z = MOD.data; T = Z.tiles.map(r => r.split(''));
  sel = null; drag = null; trail = []; undoS.length = 0; redoS.length = 0;
  view.s = Math.max(4, Math.min(22, Math.floor(Math.min(cv.clientWidth / Z.size[0], cv.clientHeight / Z.size[1]))));
  if (at) { view.x = at[0]; view.y = at[1]; view.s = Math.max(view.s, 14); } else { view.x = Z.origin[0] + Z.size[0] / 2; view.y = Z.origin[1] + Z.size[1] / 2; }
  status(`${Z.name} · ${Z.size[0]} × ${Z.size[1]} m${(ZONES.find(z => z.id === id) || {}).edited ? ' · your edited copy' : ''}`);
  side(); draw(); loadHeights();
}
$('zone').onchange = () => openZone($('zone').value);

/* ---------- edit helpers ---------- */
const inZone = (x, y) => x >= Z.origin[0] && y >= Z.origin[1] && x < Z.origin[0] + Z.size[0] && y < Z.origin[1] + Z.size[1];
const tileAt = (x, y) => inZone(x, y) ? T[y - Z.origin[1]][x - Z.origin[0]] : null;
const setTile = (x, y, L) => { if (inZone(x, y)) T[y - Z.origin[1]][x - Z.origin[0]] = L; };
const isPier = (o) => o.k === 'pier' || o.k === 'bridge';
const isBuilding = (o) => !isPier(o) && (BUILD_KINDS.includes(o.k) || (o.w > 2 && o.h > 2 && o.door));
const inside = (o, x, y) => x >= o.x && y >= o.y && x < o.x + (o.w || 1) && y < o.y + (o.h || 1);
const underBuilding = (x, y) => Z.objects.some(o => isBuilding(o) && inside(o, x, y));
function snapshot() { return JSON.stringify({ t: T.map(r => r.join('')), o: Z.objects, n: Z.npcs, s: Z.spawns || [], f: Z.fishing || [], nm: Z.name, lv: Z.level }); }
function restore(j) { const d = JSON.parse(j); T = d.t.map(r => r.split('')); Z.objects = d.o; Z.npcs = d.n; Z.spawns = d.s; Z.fishing = d.f; Z.name = d.nm; Z.level = d.lv; sel = null; }
function begin() { undoS.push(snapshot()); if (undoS.length > 200) undoS.shift(); redoS.length = 0; }
function undo() { if (!undoS.length) return; redoS.push(snapshot()); restore(undoS.pop()); changed(); }
function redo() { if (!redoS.length) return; undoS.push(snapshot()); restore(redoS.pop()); changed(); }
let saveT = 0;
function changed() { draw(); side(); clearTimeout(saveT); status('saving…'); saveT = setTimeout(save, 700); }
async function save() {
  Z.tiles = T.map(r => r.join(''));
  try { const r = await api('zone/' + zid, { method: 'PUT', body: JSON.stringify(MOD) }); status('saved ' + r.saved + ' · your copy (the game is unchanged until Apply)'); const z = ZONES.find(q => q.id === zid); if (z && !z.edited) { z.edited = true; $('zone').options[$('zone').selectedIndex].text = Z.name + ' •'; } }
  catch (e) { status('not saved: ' + e.message, true); }
}

/* the thing under a tile: NPC > animal > fishing > small object > building */
function pick(x, y) {
  let h = Z.npcs.find(n => n.x === x && n.y === y); if (h) return { kind: 'npc', o: h };
  h = (Z.spawns || []).find(n => n.x === x && n.y === y); if (h) return { kind: 'spawn', o: h };
  h = (Z.fishing || []).find(n => n.x === x && n.y === y); if (h) return { kind: 'fishing', o: h };
  h = Z.objects.find(o => !isBuilding(o) && !isPier(o) && inside(o, x, y)); if (h) return { kind: 'object', o: h };
  h = Z.objects.find(o => isBuilding(o) && inside(o, x, y)); if (h) return { kind: 'building', o: h };
  h = Z.objects.find(o => isPier(o) && inside(o, x, y)); if (h) return { kind: 'pier', o: h };
  return null;
}
/* moving a building carries its floor, door, furniture, the people and animals inside it */
function moveBuilding(o, dx, dy) {
  const nx = o.x + dx, ny = o.y + dy;
  if (!inZone(nx, ny) || !inZone(nx + o.w - 1, ny + o.h - 1)) return false;
  for (const q of Z.objects) if (q !== o && isBuilding(q) && nx < q.x + q.w && nx + o.w > q.x && ny < q.y + q.h && ny + o.h > q.y) return false;
  const kids = Z.objects.filter(q => q !== o && !isBuilding(q) && inside(o, q.x, q.y)).concat(Z.npcs.filter(n => inside(o, n.x, n.y)), (Z.spawns || []).filter(n => inside(o, n.x, n.y)));
  for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) if (tileAt(x, y) === 'i') setTile(x, y, '.');
  o.x = nx; o.y = ny; if (o.door) o.door = [o.door[0] + dx, o.door[1] + dy];
  for (const k of kids) { k.x += dx; k.y += dy; if (k.door) k.door = [k.door[0] + dx, k.door[1] + dy]; }
  for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) setTile(x, y, 'i');
  return true;
}
function deleteSel() {
  if (!sel) return; begin();
  const o = sel.o;
  if (sel.kind === 'building') { for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) setTile(x, y, '.'); Z.objects = Z.objects.filter(q => q !== o && !(!isBuilding(q) && inside(o, q.x, q.y))); }
  else if (sel.kind === 'object' || sel.kind === 'pier') Z.objects = Z.objects.filter(q => q !== o);
  else if (sel.kind === 'npc') Z.npcs = Z.npcs.filter(q => q !== o);
  else if (sel.kind === 'spawn') Z.spawns = Z.spawns.filter(q => q !== o);
  else if (sel.kind === 'fishing') Z.fishing = Z.fishing.filter(q => q !== o);
  sel = null; changed();
}
function dab(cx, cy, fn) { const r = brush - 1; for (let y = cy - r; y <= cy + r; y++) for (let x = cx - r; x <= cx + r; x++) if ((x - cx) ** 2 + (y - cy) ** 2 <= r * r + r * 0.6 + 0.01 && inZone(x, y) && !underBuilding(x, y)) fn(x, y); }
const hash = (x, y, s) => { let h = Math.imul(x * 374761393 + y * 668265263 + s * 2654435761, 1274126177); h ^= h >>> 13; return ((Math.imul(h, 1103515245) >>> 0) % 10000) / 10000; };
let stroke = 0;
function paintAt(x, y, shift) {
  if (tool === 'paint') dab(x, y, (a, b) => setTile(a, b, paintL));
  else if (tool === 'forest') {
    const sp = Object.keys(forestSp).filter(k => forestSp[k]); if (!sp.length) return;
    dab(x, y, (a, b) => { const L = tileAt(a, b); if (shift || forestRemove) { if (TREES.some(t => t[0] === L)) setTile(a, b, '.'); return; }
      if ('~pBFdi'.includes(L) || TREES.some(t => t[0] === L)) return;
      if (hash(a, b, stroke) < forestD) setTile(a, b, sp[Math.floor(hash(b, a, stroke + 7) * sp.length)]); });
  } else if (tool === 'erase') dab(x, y, (a, b) => setTile(a, b, '.'));
}
function lineTiles(a, b) { const out = []; let [x0, y0] = a; const [x1, y1] = b, dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  for (;;) { out.push([x0, y0]); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } return out; }
function finishTrail() {
  if (trail.length < 2) { trail = []; draw(); return; }
  begin();
  for (let i = 1; i < trail.length; i++) for (const [x, y] of lineTiles(trail[i - 1], trail[i])) {
    const r = trailW - 1;
    for (let b = -Math.floor(r / 2); b <= Math.ceil(r / 2); b++) for (let a = -Math.floor(r / 2); a <= Math.ceil(r / 2); a++) {
      const X = x + a, Y = y + b; if (!inZone(X, Y) || underBuilding(X, Y)) continue;
      const L = tileAt(X, Y); setTile(X, Y, L === '~' || L === 'B' ? (bridges ? 'B' : L) : trailL);
    }
  }
  trail = []; changed();
}

/* ---------- drawing ---------- */
const cv = $('cv'), cx = cv.getContext('2d');
const toScr = (x, y) => [(x - view.x) * view.s + cv.width / 2, (y - view.y) * view.s + cv.height / 2];
const toTile = (px, py) => [Math.floor((px - cv.width / 2) / view.s + view.x), Math.floor((py - cv.height / 2) / view.s + view.y)];
function colorOf(L) { if (L === '~') return '#3f86c0'; if (L === 'i') return '#7a6a50'; if (L === 'B') return '#8a6438'; return (META.tile || {})[L] || '#5f9e3f'; }
function draw() {
  if (!Z) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#0d1013'; cx.fillRect(0, 0, cv.width, cv.height);
  const s = view.s, [x0, y0] = toTile(0, 0), [x1, y1] = toTile(cv.width, cv.height);
  for (let y = Math.max(y0, Z.origin[1]); y <= Math.min(y1, Z.origin[1] + Z.size[1] - 1); y++) for (let x = Math.max(x0, Z.origin[0]); x <= Math.min(x1, Z.origin[0] + Z.size[0] - 1); x++) {
    let L = tileAt(x, y); const [px, py] = toScr(x, y);
    if (HG && HG.t && '~s.,f'.includes(L)) { const Eff = HG.t[y - HG.origin[1]] && HG.t[y - HG.origin[1]][x - HG.origin[0]]; if (Eff === '~' || (L === '~' && Eff)) L = Eff; }   /* the ground as the game has it: Atlas water and shore */
    const tr = META.trees[L];
