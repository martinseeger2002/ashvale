quest","quest":"ashen_crown","gift":"ashvale_stone","giftAfter":{"quest":"ashen_crown","step":3},"giftLine":"Take this stone, {name}. The well's mark is cut into it: hold it and think of home, and it will bring you back to Ashvale. It needs a while to wake again after."},{"id":"tam","name":"Tam the grocer","look":"tam","x":9,"y":43,"shop":"general"},{"id":"garrick","name":"Garrick the smith","look":"garrick","x":29,"y":44,"shop":"armoury"},{"id":"wren","name":"Wren the tailor","look":"wren","x":15,"y":46,"tailor":true,"shop":"tailor","greet":"Fancy a new look, love? Hair and clothes in the fitting room are free. Hats, capes and robes are on the counter - right-click me to trade."},{"id":"rowan","name":"Rowan the drover","look":"rowan","x":31,"y":50,"talk":"quest","quest":"drove_road","examine":"Rowan the drover, and behind him six beasts that know exactly how far it is to Saltmere."},{"id":"silas","name":"Silas the mason","look":"silas","x":18,"y":50,"talk":"quest","quest":"bronze_gate","examine":"Silas the mason. He laid the well, the two shops and the northwest gate, and he means you to know it."},{"id":"pip","name":"Pip the apprentice","look":"pip","x":20,"y":52,"talk":"quest","quest":"tin_pipe","examine":"Pip the apprentice, holding something that very likely shouldn't work."},{"id":"pax","name":"Pax the painter","look":"pax","x":24,"y":49,"examine":"Pax the painter, blue to the wrist and proud of it.","lines":["Every colour in this village came through my hands. That blue on the door took me nine tries.","They wanted the sky cheaper. A cheap sky is grey weather, I told them. It's still grey weather."]},{"id":"modulus","name":"Modulus the surveyor","look":"modulus","x":33,"y":50,"examine":"Modulus the surveyor, measuring the southwest road for the third time this morning.","lines":["I measured this street at a hundred and forty-four feet. They said it needed to be a hundred and forty-three. It is, somehow.","Everything twice, once well. That's the whole trade. Count the ground before you sell it."]},{"id":"latency","name":"Latency the warden","look":"latency","x":22,"y":44,"talk":"quest","quest":"elder_bow","examine":"Latency the warden, on the northwest road. Late to everything, and there before you are."},{"id":"symmetry","name":"Symmetry the curator","look":"symmetry","x":16,"y":57,"examine":"Symmetry the curator, watching the way the light comes in over the lake.","lines":["I keep the things that look right and I hide the ones that don't. The lake is the best thing here; it took four of us a fortnight.","The most beautiful screen is an empty one. I said so, and they gave me a room full of pots."]},{"id":"cinder","name":"Hob the cook","look":"hob","x":20,"y":57,"talk":"quest","quest":"kitchen_range","examine":"Hob the cook, at the range seven paces from the well - the only person in this village who has ever used it."},{"id":"fenn","name":"Fenn the tanner","look":"fenn","x":36,"y":48,"talk":"quest","quest":"skinning_knife","examine":"Fenn the tanner, on the lane below the southwest road, with frames of skins that nobody in this village knew he had."},{"id":"chest","name":"Ashvale chest","look":"chest","x":24,"y":53,"chest":true,"examine":"The Ashvale chest. Everything you own from Ashvale is kept in your arcade wallet; this is where you see it."},{"id":"auditor","name":"Auditor the clerk","look":"auditor","x":25,"y":53,"talk":"quest","quest":"hawk_ring","examine":"Auditor the clerk, with a ledger, a scale, and one line in the ledger he has waited forty years to close."},{"id":"aldous","name":"Father Aldous","look":"aldous","x":30,"y":58,"quest":"wayside_prayer","examine":"Father Aldous, the priest of Ashvale, in a plain grey habit with ash on the hem."},{"id":"odric","name":"Odric the merchant","look":"odric","x":209,"y":49,"examine":"Odric the merchant, sat in the grass by his wagon with one boot off.","lines":["The wheelwright from Saltmere's coming, they say. They've been saying it for a while.","If you see a grey horse on the road, it's mine. He doesn't like being called."]},{"id":"odric_wagon","name":"Crashed wagon","look":"wagon","x":211,"y":50,"examine":"A covered wagon on its side. The axle has snapped clean through.","lines":["The axle has snapped clean through. Candles and torn altar cloth lie in the grass where the load spilled."],"verb":"Search"},{"id":"guard_ash_1","name":"Town guard","look":"town_guard","x":24,"y":50,"watch":"village","examine":"A town guard. Combat level 33. He keeps the peace, and the lamps.","lines":["We keep the peace. When the day goes we light the lamps and the torches. When it comes back we put the lamps out.","Walk easy after dark, traveller. The lamps are ours to tend, and we will not have them knocked over."]},{"id":"guard_ash_2","name":"Town guard","look":"town_guard","x":12,"y":48,"watch":"village","examine":"A town guard. Combat level 33. He keeps the peace, and the lamps.","lines":["Strike one of us and the whole watch answers.","Walk easy after dark, traveller. The lamps are ours to tend, and we will not have them knocked over."]},{"id":"guard_ash_3","name":"Town guard","look":"town_guard","x":28,"y":50,"watch":"village","examine":"A town guard. Combat level 33. He keeps the peace, and the lamps.","lines":["The lamps along the street are our work, not the sun's.","Walk easy after dark, traveller. The lamps are ours to tend, and we will not have them knocked over."]},{"id":"guard_road","name":"Town guard","look":"town_guard","x":46,"y":51,"watch":"road","road":true,"examine":"A town guard. Combat level 33. He walks the cobbles from Ashvale to Saltmere and tends the lamps.","lines":["The cobbles run from Ashvale to Saltmere. I light those lamps at dusk and put them out at dawn.","Walk easy after dark, traveller. The lamps are ours to tend, and we will not have them knocked over."]}],"fishing":[{"x":37,"y":56,"fish":"shrimp_raw"},{"x":40,"y":54,"fish":"shrimp_raw"},{"x":44,"y":55,"fish":"shrimp_raw"},{"x":38,"y":59,"fish":"shrimp_raw"},{"  this town came off a boat or goes off one. I move both ends of that.","Mind the third pier, the third plank. Nobody has fixed it and nobody will, so long as it holds a rope."]},{"id":"perla","name":"Perla the net-mender","look":"perla","x":471,"y":60,"talk":"quest","quest":"empty_water","examine":"Perla the net-mender, knots going so fast they are almost a kind of speech."},{"id":"salt_chest","name":"Saltmere chest","look":"chest","x":466,"y":30,"chest":true,"examine":"The Saltmere chest, tarred against the damp. Everything you own from Ashvale is kept in your arcade wallet; this is where you see it."},{"id":"bryce","name":"Bryce the shipwright","look":"bryce","x":453,"y":68,"quest":"rudder","examine":"Bryce the shipwright, half a lifetime of Saltmere hulls behind him and one rudder in front of him."},{"id":"nessa","name":"Nessa the enchanter","look":"nessa","x":413,"y":69,"shop":"salt_magic","examine":"Nessa the enchanter, who learned her trade off the wreck of a wizard's chest that the sea gave back."},{"id":"wenna","name":"Mother Wenna","look":"wenna","x":384,"y":34,"examine":"Mother Wenna, keeper of the Saltmere chapel, a broom never far from her hand.","lines":["Eleven years I've swept this floor and nobody's knelt on it. Still, the dust doesn't know that.","Ashvale has a priest, they tell me. Father Aldous. He writes a fair letter but never comes himself."],"quests":["red_pyre"]},{"id":"hall_bank","name":"Town Hall bank","look":"chest","x":383,"y":16,"chest":true,"examine":"The Town Hall bank. Same arcade wallet as the chest by the stones; this counter is just nearer the ledgers."},{"id":"calder","name":"Mayor Calder","look":"calder","x":396,"y":16,"examine":"Mayor Calder of Saltmere, chain of office and a stack of plans that are not yet a desk.","lines":["Welcome to Saltmere's town hall. I am Mayor Calder. The west counter is the bank. This one is talk.","Ashvale is a living world on Dogecoin. You gather, fight, cook, bury bones for Prayer, and keep what you earn. Tam sells bread, Garrick smiths, Wren stitches hats and capes as tokens. The chest in each town is your arcade wallet - bag and bank are the same holdings.","Day and night here run on a two-hour wheel, not a real day. Follow the lamps after dark. Portals between towns remember you once you have touched the stones.","The tokens you hold are Omni assets. The Omni protocol writes them on Dogecoin itself, the same chain that carries the coin. They are not a costume the game invented. They are entries the chain can prove.","We mean to let those assets travel. Other chains, other protocols, markets outside this valley - wrap, bridge, list, swap. You will be able to trade an Ashvale piece where Ashvale is not running.","Whatever leaves can come home. Every ported token stays an Ashvale Omni game asset at heart, and it can always be reintegrated - brought back into this world with the same rights it had when it left. We will not mint a copy that strands the original.","None of that desk is built yet. When the bridges exist, you will hear it from this hall first."]},{"id":"guard_salt_1","name":"Town guard","look":"town_guard","x":390,"y":22,"watch":"saltmere","examine":"A town guard. Combat level 33. He keeps the peace, and the lamps.","lines":["We keep the peace. When the day goes we light the lamps and the torches. When it comes back we put the lamps out.","Walk easy after dark, traveller. The lamps are ours to tend, and we will not have them knocked over."]},{"id":"guard_salt_2","name":"Town guard","look":"town_guard","x":410,"y":23,"watch":"saltmere","examine":"A town guard. Combat level 33. He keeps the peace, and the lamps.","lines":["Strike one of us and the whole watch answers.","Walk easy after dark, traveller. The lamps are ours to tend, and we will not have them knocked over."]},{"id":"guard_salt_3","name":"Town guard","look":"town_guard","x":430,"y":22,"watch":"saltmere","examine":"A town guard. Combat level 33. He keeps the peace, and the lamps.","lines":
